name: Phase 2C fixup

on:
  push:
    branches:
      - phase2c-versioned-proposals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2c-versioned-proposals
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Patch compatibility details
        run: |
          python3 - <<'PY'
          from pathlib import Path

          proposal = Path('src/components/implantacao/ProposalTab.tsx')
          text = proposal.read_text()
          text = text.replace(
              'import { generateProposalPdf } from "../../lib/pdf/proposal-pdf";',
              'import { generatePublishedProposalPdf } from "../../lib/pdf/proposal-pdf";',
          )
          text = text.replace(
              'const [label, role] = line.split("|", 2).map((part) => part.trim());\n    return { label, role: role || null };',
              'const [label = "", role] = line.split("|", 2).map((part) => part.trim());\n    return { label, role: role || null };',
          )
          text = text.replace(
              'const bytes = await generateProposalPdf({ snapshot: version.snapshot });',
              'const bytes = await generatePublishedProposalPdf({ snapshot: version.snapshot });',
          )
          proposal.write_text(text)

          test = Path('src/lib/pdf/proposal-pdf.test.ts')
          text = test.read_text()
          text = text.replace(
              'import { generateProposalPdf } from "./proposal-pdf";',
              'import { generatePublishedProposalPdf } from "./proposal-pdf";',
          )
          text = text.replace(
              'const bytes = await generateProposalPdf({ snapshot });',
              'const bytes = await generatePublishedProposalPdf({ snapshot });',
          )
          test.write_text(text)
          PY
          bunx prettier --write \
            src/components/implantacao/ProposalTab.tsx \
            src/lib/pdf/proposal-pdf.ts \
            src/lib/pdf/proposal-pdf.test.ts \
            src/lib/api/commercial-proposals.ts \
            src/types/commercial-proposal.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "joaovictorfer"
          git config user.email "joaovictorfer@gmail.com"
          git add src/components/implantacao/ProposalTab.tsx src/lib/pdf/proposal-pdf.ts src/lib/pdf/proposal-pdf.test.ts src/lib/api/commercial-proposals.ts src/types/commercial-proposal.ts
          git commit -m "fix: ajusta compatibilidade e tipagem da fase 2C"
          git push origin HEAD:phase2c-versioned-proposals
