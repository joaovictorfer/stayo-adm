name: Phase 2 inventory selector patch

on:
  push:
    branches:
      - phase2-unify-inventory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-unify-inventory
      - name: Make blocker badge selector exact
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/phase2-inventory-visual-retry.yml')
          text = path.read_text()
          old = 'await expect(page.getByText("Bloqueador")).toBeVisible();'
          new = 'await expect(page.getByText("Bloqueador", { exact: true })).toBeVisible();'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one selector, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit selector correction
        run: |
          git config user.name "stayo-phase-executor"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/phase2-inventory-visual-retry.yml
          git commit -m "test(inventory): disambiguate blocker badge selector"
          git push origin HEAD:phase2-unify-inventory
