name: Phase 2C validation

on:
  push:
    branches:
      - phase2c-versioned-proposals

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Targeted lint
        run: >-
          bunx eslint
          src/types/commercial-proposal.ts
          src/lib/api/commercial-proposals.ts
          src/lib/pdf/proposal-pdf.ts
          src/lib/pdf/proposal-pdf.test.ts
          src/components/implantacao/ProposalTab.tsx

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build
