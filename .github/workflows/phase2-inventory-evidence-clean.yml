name: Phase 2 inventory clean evidence

on:
  push:
    branches:
      - phase2-unify-inventory

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://phase2-inventory.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_phase2_inventory_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-unify-inventory
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Create isolated preview
        run: |
          cat > src/routes/portal.phase2-inventory-evidence.tsx <<'EOF'
          import { createFileRoute } from "@tanstack/react-router";
          import { EnxovalTab } from "../components/implantacao/EnxovalTab";
          export const Route = createFileRoute("/portal/phase2-inventory-evidence")({ component: Preview });
          function Preview() {
            return <main className="min-h-screen bg-slate-50 p-3 sm:p-6"><div className="mx-auto max-w-5xl rounded-2xl border bg-white p-3 sm:p-6"><EnxovalTab implementationId="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" /></div></main>;
          }
          EOF
          cat > playwright.phase2-inventory-evidence.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./e2e-phase2-inventory-evidence",
            workers: 1,
            reporter: [["list"]],
            use: { baseURL: "http://127.0.0.1:8245" },
            webServer: {
              command: "bun run dev --port 8245 --host 127.0.0.1",
              url: "http://127.0.0.1:8245/portal/phase2-inventory-evidence",
              timeout: 90000,
              env: { ...process.env, VITE_SUPABASE_URL: "https://phase2-inventory.invalid", VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_phase2_inventory_test" },
            },
          });
          EOF
          mkdir -p e2e-phase2-inventory-evidence
          cat > e2e-phase2-inventory-evidence/evidence.spec.ts <<'EOF'
          import { expect, test, type BrowserContext, type Page } from "@playwright/test";
          const implementationId = "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa";
          const now = "2026-09-27T03:00:00Z";
          const items = [
            { id:"00000000-0000-0000-0000-000000000001", implementation_id:implementationId, module:"enxoval", name:"Taças de vinho", room:"Cozinha", size:null, required_qty:6, existing_qty:6, status:"pendente", priority:"media", responsible:"stayo", blocks_readiness:false, notes:null, display_order:1, created_at:now, updated_at:now },
            { id:"00000000-0000-0000-0000-000000000002", implementation_id:implementationId, module:"enxoval", name:"Cafeteira", room:"Cozinha", size:null, required_qty:1, existing_qty:0, status:"pendente", priority:"alta", responsible:"stayo", blocks_readiness:false, notes:null, display_order:2, created_at:now, updated_at:now },
            { id:"00000000-0000-0000-0000-000000000003", implementation_id:implementationId, module:"enxoval", name:"Detector de fumaça", room:"Geral", size:null, required_qty:1, existing_qty:0, status:"pendente", priority:"alta", responsible:"stayo", blocks_readiness:true, notes:null, display_order:3, created_at:now, updated_at:now },
            { id:"00000000-0000-0000-0000-000000000004", implementation_id:implementationId, module:"faltante", name:"Secador de cabelo", room:"Banheiro", size:null, required_qty:1, existing_qty:0, status:"pendente", priority:"media", responsible:"stayo", blocks_readiness:false, notes:"Pendência manual", display_order:4, created_at:now, updated_at:now },
          ];
          async function mock(context: BrowserContext) {
            await context.route("**/rest/v1/implementation_supply_items**", async route => {
              if (route.request().method() === "GET") return route.fulfill({ status:200, contentType:"application/json", body:JSON.stringify(items) });
              return route.fulfill({ status:204, body:"" });
            });
          }
          async function ready(page: Page) {
            const retry = page.getByRole("button", { name:"Tentar novamente" });
            if (await retry.isVisible().catch(() => false)) await retry.click();
            await expect(page.getByText("Taças de vinho")).toBeVisible({ timeout:10000 });
          }
          for (const viewport of [
            { name:"mobile-390", width:390, height:844 },
            { name:"desktop-1280", width:1280, height:900 },
          ]) {
            test(`captura limpa ${viewport.name}`, async ({ browser }) => {
              const context = await browser.newContext({ viewport });
              await mock(context);
              const page = await context.newPage();
              await page.goto("/portal/phase2-inventory-evidence");
              await ready(page);
              await expect(page.getByRole("heading", { name:"Inventário" })).toBeVisible();
              await expect(page.getByText("Bloqueador", { exact:true })).toBeVisible();
              await expect(page.getByText("Pendência manual", { exact:true })).toBeVisible();
              expect(await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth)).toBe(false);
              await page.screenshot({ path:`test-results/inventory-${viewport.name}.png`, fullPage:true });
              await context.close();
            });
          }
          EOF
      - name: Capture evidence
        run: bunx playwright test -c playwright.phase2-inventory-evidence.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-inventory-clean-evidence
          path: test-results/inventory-*.png
          if-no-files-found: error
