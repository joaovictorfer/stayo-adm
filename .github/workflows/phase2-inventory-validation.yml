name: Phase 2 inventory validation

on:
  push:
    branches:
      - phase2-unify-inventory
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://phase2-inventory.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_phase2_inventory_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-unify-inventory
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Targeted lint
        run: bunx eslint src/components/implantacao/EnxovalTab.tsx src/lib/inventory-state.ts src/lib/inventory-state.test.ts

      - name: Formatting check for rewritten files
        run: bunx prettier --check src/components/implantacao/EnxovalTab.tsx src/lib/inventory-state.ts src/lib/inventory-state.test.ts

      - name: Unit and readiness regression
        run: bunx vitest run src/lib/inventory-state.test.ts src/lib/implementation-status.test.ts

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Create ephemeral public preview route
        run: |
          cat > src/routes/portal.phase2-inventory-preview.tsx <<'EOF'
          import { createFileRoute } from "@tanstack/react-router";
          import { EnxovalTab } from "../components/implantacao/EnxovalTab";

          export const Route = createFileRoute("/portal/phase2-inventory-preview")({
            component: Phase2InventoryPreview,
          });

          function Phase2InventoryPreview() {
            return (
              <main className="min-h-screen bg-slate-50 p-3 sm:p-6">
                <div className="mx-auto max-w-5xl rounded-2xl border border-slate-200 bg-white p-3 shadow-sm sm:p-6">
                  <EnxovalTab implementationId="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" />
                </div>
              </main>
            );
          }
          EOF

      - name: Create ephemeral Playwright coverage
        run: |
          cat > playwright.phase2-inventory.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: "./e2e-phase2-inventory",
            fullyParallel: false,
            workers: 1,
            reporter: [["list"]],
            use: {
              baseURL: "http://127.0.0.1:8242",
              trace: "retain-on-failure",
            },
            webServer: {
              command: "bun run dev --port 8242 --host 127.0.0.1",
              url: "http://127.0.0.1:8242/portal/phase2-inventory-preview",
              timeout: 90_000,
              env: {
                ...process.env,
                VITE_SUPABASE_URL: "https://phase2-inventory.invalid",
                VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_phase2_inventory_test",
              },
            },
          });
          EOF
          mkdir -p e2e-phase2-inventory
          cat > e2e-phase2-inventory/inventory.spec.ts <<'EOF'
          import { expect, test, type BrowserContext } from "@playwright/test";

          type Item = {
            id: string;
            implementation_id: string;
            module: "enxoval" | "faltante";
            name: string;
            room: string | null;
            size: string | null;
            required_qty: number;
            existing_qty: number;
            status: "pendente" | "comprado" | "entregue" | "instalado" | "nao_aplicavel";
            priority: "baixa" | "media" | "alta";
            responsible: string | null;
            blocks_readiness: boolean;
            notes: string | null;
            display_order: number;
            created_at: string;
            updated_at: string;
          };

          const implementationId = "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa";
          const now = "2026-09-27T03:00:00Z";
          const seed: Item[] = [
            {
              id: "00000000-0000-0000-0000-000000000001",
              implementation_id: implementationId,
              module: "enxoval",
              name: "Taças de vinho",
              room: "Cozinha",
              size: null,
              required_qty: 6,
              existing_qty: 6,
              status: "pendente",
              priority: "media",
              responsible: "stayo",
              blocks_readiness: false,
              notes: null,
              display_order: 1,
              created_at: now,
              updated_at: now,
            },
            {
              id: "00000000-0000-0000-0000-000000000002",
              implementation_id: implementationId,
              module: "enxoval",
              name: "Toalhas de banho",
              room: "Banheiro",
              size: null,
              required_qty: 6,
              existing_qty: 4,
              status: "pendente",
              priority: "media",
              responsible: "stayo",
              blocks_readiness: false,
              notes: null,
              display_order: 2,
              created_at: now,
              updated_at: now,
            },
            {
              id: "00000000-0000-0000-0000-000000000003",
              implementation_id: implementationId,
              module: "enxoval",
              name: "Cafeteira",
              room: "Cozinha",
              size: null,
              required_qty: 1,
              existing_qty: 0,
              status: "pendente",
              priority: "alta",
              responsible: "stayo",
              blocks_readiness: false,
              notes: null,
              display_order: 3,
              created_at: now,
              updated_at: now,
            },
            {
              id: "00000000-0000-0000-0000-000000000004",
              implementation_id: implementationId,
              module: "enxoval",
              name: "Detector de fumaça",
              room: "Geral",
              size: null,
              required_qty: 1,
              existing_qty: 0,
              status: "pendente",
              priority: "alta",
              responsible: "stayo",
              blocks_readiness: true,
              notes: null,
              display_order: 4,
              created_at: now,
              updated_at: now,
            },
            {
              id: "00000000-0000-0000-0000-000000000005",
              implementation_id: implementationId,
              module: "faltante",
              name: "Secador de cabelo",
              room: "Banheiro",
              size: null,
              required_qty: 1,
              existing_qty: 0,
              status: "pendente",
              priority: "media",
              responsible: "stayo",
              blocks_readiness: false,
              notes: "Pendência manual",
              display_order: 5,
              created_at: now,
              updated_at: now,
            },
          ];

          async function mockInventory(context: BrowserContext) {
            let items = structuredClone(seed);
            await context.route("**/rest/v1/implementation_supply_items**", async (route) => {
              const request = route.request();
              if (request.method() === "GET") {
                await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(items) });
                return;
              }
              if (request.method() === "PATCH") {
                const url = new URL(request.url());
                const id = (url.searchParams.get("id") ?? "").replace(/^eq\./, "");
                const patch = request.postDataJSON() as Partial<Item>;
                items = items.map((item) => (item.id === id ? { ...item, ...patch } : item));
                await route.fulfill({ status: 204, body: "" });
                return;
              }
              if (request.method() === "POST") {
                const body = request.postDataJSON() as Partial<Item>[];
                items = [...items, ...(body as Item[])];
                await route.fulfill({ status: 201, contentType: "application/json", body: "[]" });
                return;
              }
              await route.fulfill({ status: 204, body: "" });
            });
          }

          test("unifica completo, parcial, faltante, bloqueador e manual com filtros", async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await mockInventory(context);
            const page = await context.newPage();
            await page.goto("/portal/phase2-inventory-preview");

            await expect(page.getByRole("heading", { name: "Inventário" })).toBeVisible();
            await expect(page.getByText("Taças de vinho")).toBeVisible();
            await expect(page.getByText("Necessário 6 · possui 6")).toBeVisible();
            await expect(page.getByText("Toalhas de banho")).toBeVisible();
            await expect(page.getByText("Necessário 6 · possui 4")).toBeVisible();
            await expect(page.getByText("Cafeteira")).toBeVisible();
            await expect(page.getByText("Secador de cabelo")).toBeVisible();
            await expect(page.getByText("Pendência manual", { exact: true })).toBeVisible();
            await expect(page.getByText("Detector de fumaça")).toBeVisible();
            await expect(page.getByText("Bloqueador")).toBeVisible();

            await page.getByRole("button", { name: /Faltando/ }).click();
            await expect(page.getByText("Taças de vinho")).toHaveCount(0);
            await expect(page.getByText("Toalhas de banho")).toBeVisible();
            await expect(page.getByText("Cafeteira")).toBeVisible();
            await expect(page.getByText("Secador de cabelo")).toBeVisible();

            await page.getByRole("button", { name: /Resolvidos/ }).click();
            await expect(page.getByText("Taças de vinho")).toBeVisible();
            await expect(page.getByText("Cafeteira")).toHaveCount(0);

            await page.getByRole("button", { name: /Bloqueadores/ }).click();
            await expect(page.getByText("Detector de fumaça")).toBeVisible();
            await expect(page.getByText("Cafeteira")).toHaveCount(0);

            await page.getByRole("button", { name: /Todos/ }).click();
            await page.screenshot({ path: "test-results/inventory-mobile-390.png", fullPage: true });
            await context.close();
          });

          test("alterar existing_qty recalcula o estado sem criar outro item", async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 430, height: 932 } });
            await mockInventory(context);
            const page = await context.newPage();
            await page.goto("/portal/phase2-inventory-preview");

            await page.getByRole("button", { name: "Editar Toalhas de banho" }).click();
            const dialog = page.getByRole("dialog");
            const existing = dialog.getByText("Possui", { exact: true }).locator("..").getByRole("spinbutton");
            await existing.fill("6");
            await dialog.getByRole("button", { name: "Salvar item" }).click();

            await expect(page.getByText("Necessário 6 · possui 6")).toHaveCount(2);
            await page.getByRole("button", { name: /Faltando/ }).click();
            await expect(page.getByText("Toalhas de banho")).toHaveCount(0);
            await page.getByRole("button", { name: /Resolvidos/ }).click();
            await expect(page.getByText("Toalhas de banho")).toBeVisible();
            await context.close();
          });

          test("adicionar item abre modal compacto e mobile não exige tabela horizontal", async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await mockInventory(context);
            const page = await context.newPage();
            await page.goto("/portal/phase2-inventory-preview");

            await page.getByRole("button", { name: "Adicionar item", exact: true }).first().click();
            await expect(page.getByRole("dialog", { name: "Adicionar item" })).toBeVisible();
            await page.getByRole("button", { name: "Cancelar" }).click();

            const overflow = await page.evaluate(
              () => document.documentElement.scrollWidth > document.documentElement.clientWidth,
            );
            expect(overflow).toBe(false);
            await expect(page.locator("table")).toHaveCount(0);
            await context.close();
          });

          test("desktop mantém a mesma lista compacta sem overflow", async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            await mockInventory(context);
            const page = await context.newPage();
            await page.goto("/portal/phase2-inventory-preview");
            await expect(page.getByRole("heading", { name: "Inventário" })).toBeVisible();
            const overflow = await page.evaluate(
              () => document.documentElement.scrollWidth > document.documentElement.clientWidth,
            );
            expect(overflow).toBe(false);
            await page.screenshot({ path: "test-results/inventory-desktop-1280.png", fullPage: true });
            await context.close();
          });
          EOF

      - name: Run visual E2E
        run: bunx playwright test -c playwright.phase2-inventory.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-inventory-evidence
          path: |
            test-results/inventory-mobile-390.png
            test-results/inventory-desktop-1280.png
          if-no-files-found: warn
