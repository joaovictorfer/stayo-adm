name: Phase 2D.3 validation

on:
  push:
    branches: [phase2d3-public-proposal-ui]
    paths:
      - "src/lib/api/public-proposal.ts"
      - "src/components/portal/PublicProposalPresentation.tsx"
      - "src/routes/portal.proposta.$token.tsx"
      - "e2e/phase2d3-public-proposal.spec.ts"
      - "playwright.phase2d3.config.ts"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Lint changed files
        run: bunx eslint src/lib/api/public-proposal.ts src/components/portal/PublicProposalPresentation.tsx 'src/routes/portal.proposta.$token.tsx' e2e/phase2d3-public-proposal.spec.ts playwright.phase2d3.config.ts
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Phase 2D.3 E2E
        run: bunx playwright test -c playwright.phase2d3.config.ts
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d3-visual-evidence
          path: test-results/phase2d3-*.png
          if-no-files-found: ignore
