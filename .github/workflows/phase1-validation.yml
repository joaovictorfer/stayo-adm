name: Phase 1 validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/implantacao/NewOpportunityDrawer.tsx'
      - 'src/routes/implantacao.index.tsx'
      - 'src/lib/api/opportunities.ts'
      - 'src/lib/opportunity-state.ts'
      - 'src/lib/opportunity-state.test.ts'
      - 'supabase/migrations/0017_admin_opportunity_intake.sql'
      - '.github/workflows/phase1-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed files
        run: >-
          bunx prettier --write
          src/components/implantacao/NewOpportunityDrawer.tsx
          src/routes/implantacao.index.tsx
          src/lib/api/opportunities.ts
          src/lib/opportunity-state.ts
          src/lib/opportunity-state.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Lint changed files
        run: >-
          bunx eslint
          src/components/implantacao/NewOpportunityDrawer.tsx
          src/routes/implantacao.index.tsx
          src/lib/api/opportunities.ts
          src/lib/opportunity-state.ts
          src/lib/opportunity-state.test.ts
      - name: Opportunity unit tests
        run: bun test src/lib/opportunity-state.test.ts
      - name: Build
        run: bun run build
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/implantacao/NewOpportunityDrawer.tsx \
            src/routes/implantacao.index.tsx \
            src/lib/api/opportunities.ts \
            src/lib/opportunity-state.ts \
            src/lib/opportunity-state.test.ts
          git commit -m "style: formata arquivos da fase 1"
          git push origin HEAD:${{ github.head_ref }}
