name: Phase 3 suppliers visual

on:
  push:
    branches: [phase3-supplier-list-detail]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Lint suppliers
        run: bunx eslint src/components/suppliers/PropertySuppliersPanel.tsx src/lib/property-supplier-summary.ts src/lib/property-supplier-summary.test.ts

      - name: Prettier suppliers
        run: bunx prettier --check src/components/suppliers/PropertySuppliersPanel.tsx src/lib/property-supplier-summary.ts src/lib/property-supplier-summary.test.ts

      - name: Unit suppliers
        run: bunx vitest run src/lib/property-supplier-summary.test.ts

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Playwright 390px
        run: bunx playwright test --config=playwright.phase3.config.ts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-suppliers-visual
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 3
