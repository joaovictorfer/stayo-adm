name: Phase 2B validation

on:
  push:
    branches:
      - phase2b-commercial-meeting

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Targeted lint
        run: >-
          bunx eslint
          src/types/commercial-journey.ts
          src/lib/commercial-meeting-state.ts
          src/lib/commercial-meeting-state.test.ts
          src/lib/commercial-journey-state.test.ts
          src/lib/api/commercial-meetings.ts
          src/components/implantacao/CommercialMeetingPanel.tsx
          src/components/implantacao/ContractConditionsPanel.tsx
          src/routes/implantacao.index.tsx
          e2e/phase2b-commercial-layout.spec.ts

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Phase 2B responsive smoke
        run: bunx playwright test e2e/phase2b-commercial-layout.spec.ts

      - name: Upload viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-viewports
          path: test-results/phase2b-*.png
          if-no-files-found: ignore
