name: Phase 2B validation

on:
  push:
    branches:
      - phase2b-commercial-meeting

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Targeted lint
        run: >-
          bunx eslint
          src/types/commercial-journey.ts
          src/lib/commercial-meeting-state.ts
          src/lib/commercial-meeting-state.test.ts
          src/lib/commercial-journey-state.test.ts
          src/lib/api/commercial-meetings.ts
          src/components/implantacao/CommercialMeetingPanel.tsx
          src/components/implantacao/ContractConditionsPanel.tsx
          src/routes/implantacao.index.tsx
          e2e/phase2b-commercial-layout.spec.ts

      - name: Phase 2B SQL integration
        run: |
          psql -f tests/sql/phase2b_fixture.sql
          psql -f supabase/migrations/0021_commercial_meetings_and_next_actions.sql
          psql -f tests/sql/phase2b_integration.sql

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Phase 2B responsive smoke
        run: bunx playwright test e2e/phase2b-commercial-layout.spec.ts

      - name: Upload viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-viewports
          path: test-results/phase2b-*.png
          if-no-files-found: ignore
