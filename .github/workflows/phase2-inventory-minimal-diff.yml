name: Phase 2 inventory minimal diff

on:
  push:
    branches:
      - phase2-unify-inventory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-unify-inventory
          fetch-depth: 0
      - name: Restore base and apply only required navigation edits
        run: |
          git show 9ad1380bc21b676e490edfb48af60979ed68f513:src/components/implantacao/OpportunityJourney.tsx > src/components/implantacao/OpportunityJourney.tsx
          git show '9ad1380bc21b676e490edfb48af60979ed68f513:src/routes/implantacao.$id.tsx' > 'src/routes/implantacao.$id.tsx'
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected 1 match in {path}, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          journey = "src/components/implantacao/OpportunityJourney.tsx"
          replace_once(journey, '  ShoppingBasket,\n', '')
          replace_once(journey, '  Sofa,\n', '')
          replace_once(journey, 'import { MissingItemsTab } from "./MissingItemsTab";\n', '')
          replace_once(
              journey,
              '      { id: "itens", label: "Itens do imóvel", icon: Sofa, node: <EnxovalTab implementationId={id} mode="inventory" /> },\n',
              '      { id: "inventario", label: "Inventário", icon: Package, node: <EnxovalTab implementationId={id} /> },\n',
          )
          replace_once(
              journey,
              '      { id: "faltantes", label: "Itens faltantes", icon: ShoppingBasket, node: <MissingItemsTab implementationId={id} /> },\n',
              '',
          )

          route = "src/routes/implantacao.$id.tsx"
          replace_once(route, 'import { MissingItemsTab } from "../components/implantacao/MissingItemsTab";\n', '')
          replace_once(
              route,
              '                    { id: "itens", label: "Itens do imóvel", summary: "Inventário do que já existe", content: <EnxovalTab implementationId={implementation.id} mode="inventory" /> },\n',
              '                    { id: "inventario", label: "Inventário", summary: "Necessário, existente, faltas e bloqueadores em uma única lista", content: <EnxovalTab implementationId={implementation.id} /> },\n',
          )
          replace_once(
              route,
              '                    { id: "faltantes", label: "Itens faltantes", summary: "O que precisa ser comprado ou instalado", content: <MissingItemsTab implementationId={implementation.id} /> },\n',
              '',
          )
          PY
      - name: Commit minimal diff
        run: |
          git config user.name "stayo-phase-executor"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/implantacao/OpportunityJourney.tsx 'src/routes/implantacao.$id.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "fix(inventory): keep navigation diff minimal"
          git push origin HEAD:phase2-unify-inventory
