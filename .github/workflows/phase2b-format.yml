name: Phase 2B formatter

on:
  push:
    branches:
      - phase2b-commercial-meeting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Format Phase 2B files
        run: >-
          bunx prettier --write
          src/types/commercial-journey.ts
          src/lib/commercial-meeting-state.ts
          src/lib/commercial-meeting-state.test.ts
          src/lib/commercial-journey-state.test.ts
          src/lib/api/commercial-meetings.ts
          src/components/implantacao/CommercialMeetingPanel.tsx
          src/components/implantacao/ContractConditionsPanel.tsx
          src/routes/implantacao.index.tsx
          e2e/phase2b-commercial-layout.spec.ts
          src/config/commercial-meeting.css
          src/styles.css
          .github/workflows/phase2b-validation.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e .github/workflows/phase2b-validation.yml
          git commit -m "style: format phase 2B files"
          git push
